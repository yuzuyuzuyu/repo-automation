name: Security Scan
description: Scan local targets, reconcile findings, persist retry state, and optionally request one rebuild.
inputs:
  upload-sarif:
    description: 'Enable GitHub code scanning (requires security-events: write)'
    default: 'false'
  rebuild-workflow:
    description: Allowlisted image build workflow to dispatch when a fix appears
    default: ''
  trivy-version:
    description: Pinned Trivy engine
    default: v0.74.0
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Install Trivy and verify scanner operation
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: ${{ inputs.trivy-version }}
        scan-type: fs
        scan-ref: .github
        scanners: vuln
        format: json
        output: scanner-check.json
        exit-code: '0'
    - name: Scan and reconcile maintenance findings
      id: scan
      env:
        GH_TOKEN: ${{ github.token }}
        AUTOMATION_PATH: ${{ github.action_path }}
      run: python3 "$AUTOMATION_PATH/../../src/maintenance.py" scan
      shell: bash
    - name: Save reports and retry state
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: maintenance-state
        path: maintenance-results/
        if-no-files-found: error
        retention-days: 30
    - name: Refresh code scanning, including empty results after fixes
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        sarif_file: maintenance-results
        wait-for-processing: true
      if: inputs.upload-sarif == 'true'
    - name: Request one fresh rebuild for newly fixable findings
      if: steps.scan.outputs.rebuild == 'true' && inputs.rebuild-workflow != ''
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        BUILD_WORKFLOW: ${{ inputs.rebuild-workflow }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: gh workflow run "$BUILD_WORKFLOW" --ref "$DEFAULT_BRANCH"
      shell: bash
