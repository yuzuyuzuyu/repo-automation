name: Check Renovate credentials
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-renovate-credentials
  cancel-in-progress: false
jobs:
  lookup-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify user token and public dependency lookup
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api user > /dev/null
          gh api graphql -f query='query {
            repository(owner: "aquasecurity", name: "trivy-action") {
              refs(refPrefix: "refs/tags/", first: 1) { nodes { name } }
            }
          }' > /dev/null
          # Public upstream access alone does not prove the token meets our
          # organization's policies. Preset release updates also query this repo.
          # shellcheck disable=SC2016 # GraphQL variables belong to the server.
          gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="${GITHUB_REPOSITORY#*/}" -f query='query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                refs(refPrefix:"refs/tags/", first:1) { nodes { name } }
              }
            }' > /dev/null
          echo 'Lookup token authenticated; upstream and shared-release tags are accessible.'
  app-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify App credentials and required installation permissions
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-checks: read
          permission-statuses: write
          permission-vulnerability-alerts: read
      - name: Verify repository access
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" > /dev/null
          echo 'App authentication, installation permissions and repository access are valid.'
