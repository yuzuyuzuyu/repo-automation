name: Release shared automation
on:
  workflow_run:
    workflows: [CI, Renovate]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit version for a minor or major release; otherwise bump patch
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: automation-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted successful push runs on our default branch reach this job.
      # The release script requires both CI and the live Renovate job to pass.
      # Never check out a PR revision or download CI artifacts here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Release tested consumer changes
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m venv .venv
          .venv/bin/python src/release.py
