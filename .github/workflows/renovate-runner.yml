name: Shared Renovate runner
permissions:
  contents: read
  actions: write
env:
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: 44.48.1
defaults:
  run:
    shell: bash
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Keep scheduled workflows alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | .id' |
            while read -r id; do
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            done
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-checks: read
          permission-statuses: write
          permission-vulnerability-alerts: read
      - name: Route github.com datasource lookups through a user token
        env:
          LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
        run: |
          if [ -z "$LOOKUP_TOKEN" ]; then
            echo "::warning::RENOVATE_GITHUB_LOOKUP_TOKEN is not set; github-tags lookups for orgs with an IP allow list (aquasecurity/trivy-action) will fail"
            exit 0
          fi
          rules=$(jq -cn --arg t "$LOOKUP_TOKEN" \
            '["github-tags", "github-releases", "github-changelog"]
             | map({hostType: ., matchHost: "api.github.com", token: $t})')
          echo "RENOVATE_HOST_RULES=$rules" >> "$GITHUB_ENV"
      - name: Verify native automerge protection
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${DEFAULT_BRANCH}" |
            jq -e 'any(.[];
              .type == "required_status_checks" and
              .parameters.strict_required_status_checks_policy == true and
              any(.parameters.required_status_checks[];
                .context == "Dependency update safety" and .integration_id == 15368))'
        if: inputs.native-automerge
      - uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          RENOVATE_CONFIG: ${{ inputs.renovate-config }}
    timeout-minutes: 45
on:
  workflow_call:
    inputs:
      app-client-id:
        description: Repository Renovate App client ID
        required: true
        type: string
      native-automerge:
        description: Require protected native automerge; false for private repositories without rulesets
        type: boolean
        default: false
      log_level:
        description: Renovate logging level
        type: string
        default: info
      dry-run:
        description: Plan without updating repositories
        type: boolean
        default: false
      renovate-config:
        description: Trusted operator configuration, such as a narrow post-upgrade command allowlist
        type: string
        default: '{}'
    secrets:
      RENOVATE_APP_PRIVATE_KEY:
        required: true
      RENOVATE_GITHUB_LOOKUP_TOKEN:
        required: true
