name: Shared Renovate runner
permissions:
  contents: read
  actions: write
defaults:
  run:
    shell: bash
jobs:
  renovate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request_target'
    concurrency:
      group: renovate-candidates-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Verify the shared workflow source
        env:
          # These identify the reusable workflow, rather than the caller checkout.
          # JSON access also supports actionlint versions predating these fields.
          SHARED_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          SHARED_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          test "$SHARED_REPOSITORY" = yuzuyuzuyu/repo-automation
          [[ "$SHARED_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the exact shared workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Restore trusted Docker candidate observations
        id: candidates
        working-directory: automation
        env:
          GH_TOKEN: ${{ github.token }}
          RENOVATE_CANDIDATE_STATE: ${{ runner.temp }}/renovate-candidates/state.json
        run: |
          python -m venv "$RUNNER_TEMP/candidate-venv"
          "$RUNNER_TEMP/candidate-venv/bin/python" -m src.candidate_state
      - name: Prepare the pinned engine and retention adapter
        id: engine
        run: |
          image=$(jq -r .image automation/config/renovate-image.json)
          echo "version=${image#ghcr.io/renovatebot/renovate:}" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/renovate-command.sh" <<'COMMAND'
          #!/bin/sh
          set -eu
          export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=file:$RENOVATE_AUTOMATION_PATH/src/renovate_bootstrap.mjs"
          exec renovate
          COMMAND
          chmod 0755 "$RUNNER_TEMP/renovate-command.sh"
      - name: Keep scheduled workflows alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | .id' |
            while read -r id; do
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
            done
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-checks: read
          permission-statuses: write
          permission-vulnerability-alerts: read
      - name: Route github.com datasource lookups through a user token
        env:
          LOOKUP_TOKEN: ${{ secrets.RENOVATE_GITHUB_LOOKUP_TOKEN }}
        run: |
          if [ -z "$LOOKUP_TOKEN" ]; then
            echo "::warning::RENOVATE_GITHUB_LOOKUP_TOKEN is not set; github-tags lookups for orgs with an IP allow list (aquasecurity/trivy-action) will fail"
            exit 0
          fi
          rules=$(jq -cn --arg t "$LOOKUP_TOKEN" \
            '["github-tags", "github-releases", "github-changelog"]
             | map({hostType: ., matchHost: "api.github.com", token: $t})')
          echo "RENOVATE_HOST_RULES=$rules" >> "$GITHUB_ENV"
      - name: Verify native automerge protection
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${DEFAULT_BRANCH}" |
            jq -e 'any(.[];
              .type == "required_status_checks" and
              .parameters.strict_required_status_checks_policy == true and
              any(.parameters.required_status_checks[];
                .context == "Dependency update safety" and .integration_id == 15368))'
        if: inputs.native-automerge
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ steps.engine.outputs.version }}
          docker-cmd-file: ${{ runner.temp }}/renovate-command.sh
          # The action splits mounts on semicolons, not newlines.
          docker-volumes: >-
            ${{ runner.temp }}:${{ runner.temp }};
            ${{ github.workspace }}/automation:${{ github.workspace }}/automation:ro
        env:
          RENOVATE_AUTOMATION_PATH: ${{ github.workspace }}/automation
          RENOVATE_CANDIDATE_STATE: ${{ runner.temp }}/renovate-candidates/state.json
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # An aborted repository must fail the job, including host/adapter errors.
          RENOVATE_EXIT_CODE_FOR_ERRORS: 'true'
          # Docker Hub rejects anonymous pagination beyond 1,000 tags. Stay
          # within 10 pages to retain timestamps for release-age checks.
          RENOVATE_DOCKER_MAX_PAGES: '10'
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          RENOVATE_CONFIG: ${{ inputs.renovate-config }}
      - name: Preserve observations even if a later Renovate operation failed
        if: always() && steps.candidates.outcome == 'success' && !inputs.dry-run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-candidates-v1
          path: ${{ runner.temp }}/renovate-candidates/state.json
          retention-days: 90
          if-no-files-found: error
    timeout-minutes: 45
on:
  workflow_call:
    inputs:
      app-client-id:
        description: Repository Renovate App client ID
        required: true
        type: string
      native-automerge:
        description: Require protected native automerge; false for private repositories without rulesets
        type: boolean
        default: false
      log_level:
        description: Renovate logging level
        type: string
        default: info
      dry-run:
        description: Plan without updating repositories
        type: boolean
        default: false
      renovate-config:
        description: Trusted operator configuration, such as a narrow post-upgrade command allowlist
        type: string
        default: '{}'
    secrets:
      RENOVATE_APP_PRIVATE_KEY:
        required: true
      RENOVATE_GITHUB_LOOKUP_TOKEN:
        required: true
